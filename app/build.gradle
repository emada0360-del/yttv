plugins {
    id 'com.android.application'
}
android {
    namespace 'com.yttv.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.yttv.app"
        minSdk 21
        targetSdk 22
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
